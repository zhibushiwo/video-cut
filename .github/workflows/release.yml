# 自动发版：推 main → 构建 Windows 安装包 → 以 v<package.json 版本> 建 Release 并上传。
# 发布说明取自 docs/CHANGELOG.md 对应版本段；同版本已发布则整体跳过（重复推 main 不重发）。
# 开发在 dev 分支进行，dev 推送不触发。
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号（单一真源 = package.json，红线 22）
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 该版本已发布则跳过
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'false'
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.exists == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.exists == 'false'
        with:
          workspaces: src-tauri

      - name: 下载 sidecar（ffmpeg + whisper，脚本自带 SHA256 校验）
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          ./scripts/fetch-ffmpeg.ps1
          ./scripts/fetch-whisper.ps1

      - name: 安装前端依赖
        if: steps.check.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: 构建
        if: steps.check.outputs.exists == 'false'
        run: pnpm tauri build

      - name: 从 CHANGELOG 提取发布说明
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $md = Get-Content docs/CHANGELOG.md -Raw
          $ver = "${{ steps.version.outputs.version }}"
          $pat = "(?ms)^## \[" + [regex]::Escape($ver) + "\] - \d{4}-\d{2}-\d{2}\s*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($md, $pat)
          if ($m.Success) { $body = $m.Groups[1].Value.Trim() } else { $body = "video-cut v$ver`n`n完整变更见仓库 docs/CHANGELOG.md。" }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: 创建 Release 并上传安装包
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: src-tauri/target/release/bundle/nsis/*.exe
